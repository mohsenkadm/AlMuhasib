name: almuhasib_mobile
description: المحاسب — تطبيق جوال للتقارير ولوحة التحكم
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.1
  easy_localization: ^3.0.7+1
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^6.1.4
  intl: ^0.20.2
  onesignal_flutter: ^5.3.0
  device_info_plus: ^11.3.3
  uuid: ^4.5.1
  flutter_animate: ^4.5.2
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.5

flutter_native_splash:
  color: "#0D47A1"
  color_dark: "#070B14"
  android_12:
    color: "#0D47A1"
    color_dark: "#070B14"

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - .env
